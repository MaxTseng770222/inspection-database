<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星際數據終端 - 客戶專屬登入</title>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 將背景圖設為同目錄下的圖片檔名 */
      background: #060913 url('登入背景-星海與地球.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      overflow-x: hidden;
      color: #e2e8f0;
    }

    /* 背景微光暗化遮罩，增強卡片可讀性 */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(10, 15, 30, 0.45) 0%, rgba(5, 8, 18, 0.82) 100%);
      z-index: 1;
    }

    /* 毛玻璃科技感登入卡片 */
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      margin: 20px;
      background: rgba(13, 20, 36, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(56, 189, 248, 0.15);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    input::placeholder {
      color: #64748b;
    }

    /* 登入按鈕 */
    .btn-submit {
      width: 100%;
      padding: 12px 0;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* 訊息提示框 */
    #statusMessage {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
      text-align: center;
      word-break: break-all;
    }

    .status-error {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    .status-info {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
    }

    /* 登入成功後面板 */
    #portalBox {
      display: none;
      text-align: center;
    }

    .welcome-text {
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .user-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 20px;
      font-size: 13px;
      color: #bae6fd;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="login-container">
    <!-- 登入表單 -->
    <div id="loginFormSection">
      <div class="brand-header">
        <h1 class="brand-title">檢驗數據終端系統</h1>
        <p class="brand-subtitle">INSPECTION DATABASE ACCESS</p>
      </div>

      <div class="form-group">
        <label for="username">使用者帳號 (Username)</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            placeholder="請輸入帳號 (例如: client01)" 
            autocomplete="username" 
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">安全密碼 (Password)</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="請輸入通行密碼" 
            autocomplete="current-password" 
            required
          />
        </div>
      </div>

      <button id="loginBtn" class="btn-submit">驗證連線並登入</button>
    </div>

    <!-- 登入成功狀態展示 -->
    <div id="portalBox">
      <div class="brand-header">
        <h2 class="welcome-text">系統連線成功</h2>
        <div class="user-badge" id="userBadge">帳號：-</div>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">
          身分驗證已通過，您現在具備專屬資料夾存取權限。
        </p>
        <button id="logoutBtn" class="btn-logout">中斷連線 (登出)</button>
      </div>
    </div>

    <div id="statusMessage"></div>
  </div>

  <script>
    // 1. 初始化 Supabase 客戶端
    const { createClient } = supabase;

    // 請替換為您的 Supabase 專案參數
    const SUPABASE_URL = 'https://admaccvexnsedcawifsd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_94TFG3LvJ904VE35qyFhmg_now-EM8X';

    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. DOM 元素
    const loginFormSection = document.getElementById('loginFormSection');
    const portalBox = document.getElementById('portalBox');
    const userBadge = document.getElementById('userBadge');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusMessage = document.getElementById('statusMessage');

    // 狀態提示函式
    function showStatus(text, type = 'info') {
      statusMessage.style.display = 'block';
      statusMessage.className = `status-${type}`;
      statusMessage.innerText = text;
    }

    function clearStatus() {
      statusMessage.style.display = 'none';
      statusMessage.innerText = '';
    }

    // 檢查現有登入狀態
    async function checkAuthSession() {
      const { data: { user } } = await client.auth.getUser();
      if (user) {
        loginFormSection.style.display = 'none';
        portalBox.style.display = 'block';
        userBadge.innerText = '登入身分：' + (user.email.split('@')[0]);
      } else {
        loginFormSection.style.display = 'block';
        portalBox.style.display = 'none';
      }
    }

    // 3. 帳號密碼登入 (支援純帳號自動轉換為內部識別格式)
    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showStatus('請完整輸入使用者帳號與密碼', 'error');
        return;
      }

      // 自動補上內部網域後綴 (若輸入 client01 轉為 client01@pmc.local)
      const internalEmail = username.includes('@') 
        ? username 
        : `${username.toLowerCase()}@pmc.local`;

      try {
        loginBtn.disabled = true;
        showStatus('正在驗證憑證並連線至資料庫終端...', 'info');

        const { data, error } = await client.auth.signInWithPassword({
          email: internalEmail,
          password: password
        });

        if (error) {
          throw error;
        }

        showStatus('登入成功，正在載入專屬數據...', 'success');
        setTimeout(() => {
          clearStatus();
          checkAuthSession();
        }, 600);

      } catch (err) {
        console.error('登入失敗:', err);
        showStatus('登入失敗：帳號或密碼錯誤，請重新確認', 'error');
      } finally {
        loginBtn.disabled = false;
      }
    });

    // 支援按下 Enter 鍵直接登入
    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
          loginBtn.click();
        }
      });
    });

    // 4. 登出
    logoutBtn.addEventListener('click', async () => {
      await client.auth.signOut();
      usernameInput.value = '';
      passwordInput.value = '';
      clearStatus();
      checkAuthSession();
    });

    // 初始載入時檢查 Session
    checkAuthSession();
  </script>
</body>
</html>
