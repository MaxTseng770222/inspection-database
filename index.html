<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星際數據終端 - 客戶專屬終端系統</title>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS for Excel Import/Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #060913 url('登入背景-星海與地球.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      overflow-x: hidden;
      color: #e2e8f0;
      padding: 24px 12px;
    }

    /* 背景暗化遮罩 */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(10, 15, 30, 0.45) 0%, rgba(5, 8, 18, 0.85) 100%);
      z-index: 1;
    }

    /* 登入卡片容器 (登入前) */
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      background: rgba(13, 20, 36, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(56, 189, 248, 0.15);
      transition: all 0.3s ease;
    }

    /* 終端面板容器 (登入後展開寬版) */
    .dashboard-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1050px;
      padding: 32px;
      background: rgba(13, 20, 36, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.18);
      display: none;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* 頂部控制列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 24px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 20px;
      font-size: 13px;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #dc2626;
    }

    /* 功能區塊卡片 */
    .module-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .module-card:last-child {
      margin-bottom: 0;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .module-title {
      font-size: 16px;
      font-weight: 600;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 數據表格設計 */
    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.4) rgba(15, 23, 42, 0.6);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(56, 189, 248, 0.05);
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .status-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .status-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    /* 檔案下載與按鈕 */
    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      transform: translateY(-1px);
    }

    .btn-refresh {
      background: transparent;
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    /* 上傳回傳區域 */
    .upload-zone {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      border: 1px dashed rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 16px;
    }

    .upload-zone input[type="file"] {
      color: #94a3b8;
      font-size: 13px;
    }

    .upload-zone input[type="file"]::file-selector-button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 12px;
      transition: background 0.2s;
    }

    .upload-zone input[type="file"]::file-selector-button:hover {
      background: #334155;
    }

    /* 表單元件樣式 (登入用) */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 12px 0;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }

    .btn-submit:disabled, .btn-action:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* 提示訊息 */
    #statusMessage {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
      text-align: center;
      word-break: break-all;
    }

    .status-error { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .status-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #6ee7b7; }
    .status-info { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #7dd3fc; }

    /* ==========================================
       資料夾展開與檔案格式特化樣式 (Tree View)
       ========================================== */
    .folder-row {
      background: rgba(30, 41, 59, 0.65) !important;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .folder-row:hover {
      background: rgba(56, 189, 248, 0.15) !important;
    }

    .folder-title {
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .folder-arrow {
      display: inline-block;
      transition: transform 0.25s ease;
      font-size: 12px;
      color: #7dd3fc;
    }

    .folder-arrow.expanded {
      transform: rotate(90deg);
    }

    .folder-count-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      margin-left: 6px;
    }

    .file-row {
      transition: opacity 0.2s ease;
    }

    .file-row.hidden {
      display: none;
    }

    .file-name-cell {
      padding-left: 36px !important;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 格式標籤 (Format Badges) */
    .format-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .format-pdf {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .format-excel {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .format-img {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .format-cad {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .format-other {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    /* =========================================================
       響應式設計 (RWD) 與手機 / 電腦雙端體驗深度優化
       ========================================================= */

    /* 滾動條美化 */
    .table-container::-webkit-scrollbar {
      height: 6px;
    }
    .table-container::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.35);
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.6);
    }

    /* 手機端斷點 (<= 768px) */
    @media (max-width: 768px) {
      body {
        padding: 12px 6px;
        align-items: flex-start;
      }

      .login-container {
        padding: 28px 18px;
        max-width: 100%;
        margin-top: 20px;
      }

      .dashboard-container {
        padding: 16px 12px;
        max-width: 100%;
        border-radius: 12px;
      }

      input[type="text"],
      input[type="password"] {
        font-size: 16px;
        padding: 12px;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
        margin-bottom: 18px;
      }

      .user-info {
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .btn-logout {
        width: 100%;
        padding: 10px 0;
        text-align: center;
      }

      .module-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .module-header > div:last-child {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
      }

      .module-header > div:last-child button {
        flex: 1 1 calc(50% - 6px);
        min-height: 40px;
        justify-content: center;
      }

      .btn-action, .btn-refresh {
        padding: 8px 12px;
        min-height: 40px;
        justify-content: center;
      }

      .module-card {
        padding: 14px 10px;
        margin-bottom: 16px;
      }

      .module-title {
        font-size: 15px;
      }

      th, td {
        padding: 10px 8px;
        font-size: 12px;
      }

      .file-name-cell {
        padding-left: 20px !important;
        max-width: 180px;
        word-break: break-all;
      }

      .upload-zone {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .upload-zone input[type="file"] {
        width: 100%;
      }

      .upload-zone .btn-action {
        width: 100%;
        padding: 11px 0;
        text-align: center;
      }
    }

    /* 平板及小型筆電 (769px ~ 1024px) */
    @media (min-width: 769px) and (max-width: 1024px) {
      .dashboard-container {
        padding: 24px 20px;
        max-width: 95%;
      }
    }

    /* 電腦滑鼠懸停回饋 */
    @media (hover: hover) and (pointer: fine) {
      .btn-action:hover, .btn-submit:hover {
        cursor: pointer;
        filter: brightness(1.1);
      }
      .folder-row:hover {
        background: rgba(56, 189, 248, 0.18) !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- 1. 登入面板 -->
  <div class="login-container" id="loginContainer">
    <div class="brand-header">
      <h1 class="brand-title">檢驗數據終端系統</h1>
      <p class="brand-subtitle">INSPECTION DATABASE ACCESS</p>
    </div>

    <div class="form-group">
      <label for="username">使用者帳號 (Username)</label>
      <input 
        type="text" 
        id="username" 
        placeholder="請輸入帳號 (例如: jainnher)" 
        autocomplete="username" 
        required
      />
    </div>

    <div class="form-group">
      <label for="password">安全密碼 (Password)</label>
      <input 
        type="password" 
        id="password" 
        placeholder="請輸入通行密碼" 
        autocomplete="current-password" 
        required
      />
    </div>

    <button id="loginBtn" class="btn-submit">驗證連線並登入</button>
    <div id="statusMessage"></div>
  </div>

  <!-- 2. 登入成功後的客戶專屬終端儀表板 -->
  <div class="dashboard-container" id="dashboardContainer">
    <!-- 頂部身分與登出 -->
    <div class="top-bar">
      <div class="user-info">
        <h2 style="font-size: 18px; color: #f8fafc; letter-spacing: 1px;">數據連線終端</h2>
        <span class="user-badge" id="userBadge">帳號：-</span>
      </div>
      <button id="logoutBtn" class="btn-logout">中斷連線 (登出)</button>
    </div>

    <!-- 模組 A：檢驗數據報表表格 (結構化數據) -->
    <div class="module-card">
      <div class="module-header">
        <div class="module-title" id="reportModuleTitle">📊 客戶專屬檢驗報表</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <input type="file" id="excelImportInput" accept=".xlsx, .xls, .csv" style="display: none;" />
          <button id="importExcelBtn" class="btn-refresh" style="border-color: #34d399; color: #34d399;">📥 匯入 Excel 連動</button>
          <button id="downloadExcelBtn" class="btn-action" style="padding: 5px 12px; font-size: 12px;">📊 下載報表 (Excel)</button>
          <button id="refreshTableBtn" class="btn-refresh">重新整理</button>
        </div>
      </div>
      <div class="table-container">
        <table id="inspectionTable">
          <thead id="inspectionTableHead">
            <tr>
              <th>工件 / 機台編號</th>
              <th>檢驗項目</th>
              <th>量測數值</th>
              <th>公差範圍</th>
              <th>判定結果</th>
              <th>檢驗日期</th>
            </tr>
          </thead>
          <tbody id="inspectionTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: #94a3b8; padding: 20px;">載入量測數據中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 模組 B：檔案清單與一鍵下載 (可展開資料夾與辨識 PDF 格式) -->
    <div class="module-card">
      <div class="module-header">
        <div class="module-title">📁 檢驗報告與文件下載區</div>
        <div style="display: flex; gap: 8px;">
          <button id="toggleAllFoldersBtn" class="btn-refresh" style="border-color: #38bdf8; color: #38bdf8;">📂 全部展開 / 收合</button>
          <button id="refreshFilesBtn" class="btn-refresh">重新整理檔案</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="min-width: 320px;">資料夾 / 檔案名稱</th>
              <th>格式種類</th>
              <th>檔案大小</th>
              <th>上傳更新時間</th>
              <th style="width: 120px; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="fileListBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">正在讀取專屬資料夾檔案...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 模組 C：客戶端上傳回傳 (確認單、問題照片、回簽資料) -->
    <div class="module-card">
      <div class="module-header">
        <div class="module-title">📤 客戶端數據與檔案回傳</div>
      </div>
      <div class="upload-zone">
        <input type="file" id="clientUploadInput" />
        <button id="clientUploadBtn" class="btn-action">確認上傳回傳</button>
        <span id="uploadStatusText" style="font-size: 13px; color: #94a3b8;">支援 PDF、圖片、CAD 與檢驗數據檔案</span>
      </div>
    </div>
  </div>

  <script>
    // 1. 初始化 Supabase
    const { createClient } = supabase;
    const SUPABASE_URL = 'https://admaccvexnsedcawifsd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_94TFG3LvJ904VE35qyFhmg_now-EM8X';
    const BUCKET_NAME = 'INSPECTION DATA BASE';

    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. DOM 元素
    const loginContainer = document.getElementById('loginContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusMessage = document.getElementById('statusMessage');
    const userBadge = document.getElementById('userBadge');
    const reportModuleTitle = document.getElementById('reportModuleTitle');
    const inspectionTableHead = document.getElementById('inspectionTableHead');
    const inspectionTableBody = document.getElementById('inspectionTableBody');
    const fileListBody = document.getElementById('fileListBody');
    const refreshTableBtn = document.getElementById('refreshTableBtn');
    const refreshFilesBtn = document.getElementById('refreshFilesBtn');
    const toggleAllFoldersBtn = document.getElementById('toggleAllFoldersBtn');
    const clientUploadInput = document.getElementById('clientUploadInput');
    const clientUploadBtn = document.getElementById('clientUploadBtn');
    const uploadStatusText = document.getElementById('uploadStatusText');

    let currentUsername = '';
    let currentUserId = '';
    let activeTableName = '';

    // 動態取得資料表可能候選名稱清單（容錯支援帶連字號、無連字號等各種命名）
    function getCandidateTableNames() {
      if (!currentUsername) return [];
      const clean = currentUsername.toLowerCase().trim();
      const list = [
        `${clean}2026`,                        // 優先如 jainnher2026, chin-yuh2026
        clean,                                 // 如 jainnher
        `${clean.replace(/[-_]/g, '')}2026`,   // 如 chinyuh2026
        `${clean.replace(/_/g, '-')}2026`,     // 如 chin-yuh2026
        `${clean.replace(/-/g, '_')}2026`      // 如 chin_yuh2026
      ];
      // 去重
      return [...new Set(list)];
    }

    function showStatus(text, type = 'info') {
      statusMessage.style.display = 'block';
      statusMessage.className = `status-${type}`;
      statusMessage.innerText = text;
    }

    function clearStatus() {
      statusMessage.style.display = 'none';
      statusMessage.innerText = '';
    }

    // 3. 檢查登入 Session 與身分權限
    let currentUserRole = 'client';

    async function checkAuthSession() {
      try {
        const { data: { user }, error: userError } = await client.auth.getUser();
        if (user) {
          currentUserId = user.id;
          currentUsername = user.email.split('@')[0];
          loginContainer.style.display = 'none';
          dashboardContainer.style.display = 'block';

          // 查詢使用者角色
          try {
            const { data: roleData, error: roleError } = await client
              .from('user_roles')
              .select('role')
              .eq('user_id', user.id)
              .maybeSingle();

            if (!roleError && roleData && roleData.role) {
              currentUserRole = roleData.role;
            } else {
              currentUserRole = 'client';
            }
          } catch (err) {
            console.warn('角色權限查詢跳過，預設為客戶模式:', err);
            currentUserRole = 'client';
          }

          applyRolePermissions(currentUserRole, currentUsername);
          loadInspectionData();
          loadCustomerFiles();
        } else {
          currentUsername = '';
          currentUserId = '';
          currentUserRole = 'client';
          activeTableName = '';
          loginContainer.style.display = 'block';
          dashboardContainer.style.display = 'none';
        }
      } catch (err) {
        console.error('Session 驗證異常:', err);
      }
    }

    function applyRolePermissions(role, username) {
      if (role === 'admin') {
        userBadge.innerText = '登入身分：' + username + ' (系統管理員)';
        userBadge.style.color = '#34d399';
        userBadge.style.borderColor = 'rgba(52, 211, 153, 0.4)';
        userBadge.style.background = 'rgba(16, 185, 129, 0.15)';
        if (importExcelBtn) importExcelBtn.style.display = 'inline-block';
        if (reportModuleTitle) reportModuleTitle.innerText = `📊 管理員總覽：${username} 檢驗報表`;
      } else {
        userBadge.innerText = '登入身分：' + username + ' (專屬客戶)';
        userBadge.style.color = '#38bdf8';
        userBadge.style.borderColor = 'rgba(56, 189, 248, 0.35)';
        userBadge.style.background = 'rgba(56, 189, 248, 0.15)';
        if (importExcelBtn) importExcelBtn.style.display = 'none';
        if (reportModuleTitle) reportModuleTitle.innerText = `📊 ${username} 專屬檢驗報表`;
      }
    }

    // 4. 登入邏輯
    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showStatus('請完整輸入使用者帳號與密碼', 'error');
        return;
      }

      const internalEmail = username.includes('@') 
        ? username 
        : `${username.toLowerCase()}@pmc.local`;

      try {
        loginBtn.disabled = true;
        showStatus('正在驗證憑證並連線至資料庫終端...', 'info');

        const { data, error } = await client.auth.signInWithPassword({
          email: internalEmail,
          password: password
        });

        if (error) throw error;

        showStatus('登入成功，正在載入專屬終端...', 'success');

          clearStatus();
          checkAuthSession();

      } catch (err) {
        console.error('登入失敗:', err);

      });

    logoutBtn.addEventListener('click', async () => {

    // ==========================================
    // 功能 1：動態表頭 (Dynamic Schema) 與數據渲染
    // ==========================================
    let currentInspectionData = [];
    let currentTableHeaders = [];

    function renderDynamicInspectionTable(headers, dataList) {
      if (!dataList || dataList.length === 0) {
        inspectionTableBody.innerHTML = `<tr><td colspan="${headers.length || 6}" style="text-align: center; color: #94a3b8; padding: 20px;">尚無檢驗量測數據</td></tr>`;
        return;
      }

      currentTableHeaders = headers;
      currentInspectionData = dataList;

      // 1. 動態表頭
      let headHtml = '<tr>';
      headers.forEach(h => {
        headHtml += `<th>${h.label || h.key || h}</th>`;
      });
      headHtml += '</tr>';
      inspectionTableHead.innerHTML = headHtml;

      // 2. 動態資料列
      let bodyHtml = '';
      dataList.forEach(item => {
        bodyHtml += '<tr>';
        headers.forEach(h => {
            const key = typeof h === 'object' ? h.key : h;
      // 若為 null、undefined 或是純空白字元，皆轉為空字串 ''
            const rawVal = item[key];
            const val = (rawVal !== undefined && rawVal !== null) ? String(rawVal).trim() : '';
          
          const lowerKey = String(key).toLowerCase();
  const lowerLabel = String(h.label || '').toLowerCase();

  // 若值為空白，直接渲染空儲存格
  if (val === '') {
    bodyHtml += `<td></td>`;
  } else if (lowerKey.includes('result') || lowerKey.includes('判定') || lowerLabel.includes('判定') || lowerLabel.includes('結果')) {
    const isPass = String(val).toUpperCase().includes('PASS') || String(val).includes('合格') || String(val).includes('OK');
    const isFail = String(val).toUpperCase().includes('FAIL') || String(val).includes('不合格') || String(val).includes('NG');
    const badgeClass = isPass ? 'status-pass' : (isFail ? 'status-fail' : 'status-info');
    bodyHtml += `<td><span class="badge-status ${badgeClass}">${val}</span></td>`;
  } else if (lowerKey.includes('code') || lowerKey.includes('編號') || lowerLabel.includes('編號') || lowerKey === '機台名稱') {
    bodyHtml += `<td><strong style="color: #38bdf8;">${val}</strong></td>`;
  } else {
    bodyHtml += `<td>${val}</td>`;
  }
        });
        bodyHtml += '</tr>';
      });
      inspectionTableBody.innerHTML = bodyHtml;
    }

    // =========================================================================
    // 核心修復：載入報表數據 (自動排除表名不符、RLS阻擋與空資料問題)
    // =========================================================================
    async function loadInspectionData() {
      if (!currentUsername) {
        console.warn('[報表除錯] 尚未取得使用者帳號名稱，暫緩查詢報表');
        return;
      }

      const candidates = getCandidateTableNames();
      inspectionTableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">正在連線讀取客戶專屬報表資料...</td></tr>`;

      let querySuccess = false;
      let finalData = null;
      let usedTableName = '';
      let lastErrorMessage = '';

      // 1. 自動遍歷可能的資料表名稱 (避免大小寫或連字號差異)
      for (const tName of candidates) {
        try {
          console.log(`[報表除錯] 嘗試查詢資料表: public."${tName}"`);
          const { data, error } = await client
            .from(tName)
            .select('*');

          if (!error) {
            querySuccess = true;
            usedTableName = tName;
            finalData = data;
            activeTableName = tName;
            console.log(`[報表除錯] 成功命中資料表 "${tName}"，取得筆數:`, data?.length);
            break;
          } else {
            // 如果是資料表不存在的錯誤 (PGRST200 等)，繼續嘗試下一個候選表名
            console.warn(`[報表除錯] 資料表 "${tName}" 查詢跳過:`, error.message);
            lastErrorMessage = error.message;
          }
        } catch (e) {
          lastErrorMessage = e.message;
        }
      }

      // 2. 所有候選表名皆查詢失敗
      if (!querySuccess) {
        console.error('[報表除錯] 所有候選資料表均無法連線:', lastErrorMessage);
        inspectionTableBody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; color: #f87171; padding: 24px;">
              <div style="font-weight: 600; margin-bottom: 6px;">❌ 載入專屬報表失敗</div>
              <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 6px;">錯誤訊息：${lastErrorMessage}</div>
              <div style="font-size: 11px; color: #94a3b8;">
                請確認 Supabase 後台是否已建立名稱為 <code>${candidates[0]}</code> 的資料表。
              </div>
            </td>
          </tr>
        `;
        return;
      }

      // 更新模組標題
      if (reportModuleTitle) {
        reportModuleTitle.innerText = currentUserRole === 'admin' 
          ? `📊 管理員總覽：${usedTableName} 檢驗報表` 
          : `📊 ${currentUsername} 專屬檢驗報表 (${usedTableName})`;
      }

      // 3. 資料庫回傳為空陣列 (0 筆資料) - 提供明確的 RLS 與指派提示
      if (!finalData || finalData.length === 0) {
        console.warn(`[報表除錯] 資料表 "${usedTableName}" 存在，但回傳 0 筆資料。`);
        inspectionTableBody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; color: #94a3b8; padding: 28px 16px;">
              <div style="font-size: 15px; color: #fbbf24; margin-bottom: 8px;">⚠️ 目前尚無符合權限的專屬報表資料</div>
              <div style="font-size: 12px; color: #94a3b8; max-width: 600px; margin: 0 auto; line-height: 1.6;">
                資料表 <code>${usedTableName}</code> 已連線成功，但未讀取到資料列。<br />
                <strong>可能原因：</strong>資料表啟用了 RLS (Row Level Security)，而現有資料尚未將 <code>assigned_user_id</code> 綁定為當前帳號 UID (<code style="color: #38bdf8;">${currentUserId || '未取得'}</code>)。<br />
                <span style="color: #64748b; font-size: 11px;">(若剛匯入 Excel，請於 Supabase 執行 UPDATE 綁定客戶 UID 即可立即顯示)</span>
              </div>
            </td>
          </tr>
        `;
        currentInspectionData = [];
        return;
      }

      // 4. 成功讀取到資料列 -> 動態偵測第一列欄位作為表頭並渲染
      // 自動排除系統內部與無關欄位 (即使沒有 id 也不會報錯)
      const ignoredColumns = ['id', 'assigned_user_id', 'created_at', 'updated_at'];
      const sampleRow = finalData[0];
      const dynamicHeaders = Object.keys(sampleRow)
        .filter(col => !ignoredColumns.includes(col))
        .map(col => ({
          key: col,
          label: col
        }));

      console.log('[報表除錯] 解析動態表頭成功:', dynamicHeaders.map(h => h.key));
      renderDynamicInspectionTable(dynamicHeaders, finalData);
    }

    refreshTableBtn.addEventListener('click', loadInspectionData);

    // =======================================================
    // 功能 2：可展開式資料夾樹狀清單與 PDF/多檔案格式精準辨識
    // =======================================================
    function getFileFormatMeta(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        return { type: 'PDF', icon: '📕', badgeClass: 'format-pdf', label: 'PDF 文件' };
      } else if (['xlsx', 'xls', 'csv'].includes(ext)) {
        return { type: 'EXCEL', icon: '📊', badgeClass: 'format-excel', label: '試算表' };
      } else if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
        return { type: 'IMAGE', icon: '🖼️', badgeClass: 'format-img', label: '影像圖檔' };
      } else if (['dwg', 'dxf', 'step', 'stp', 'iges', 'igs'].includes(ext)) {
        return { type: 'CAD', icon: '📐', badgeClass: 'format-cad', label: 'CAD 工程圖' };
      } else if (['doc', 'docx'].includes(ext)) {
        return { type: 'WORD', icon: '📘', badgeClass: 'format-other', label: 'Word 文件' };
      } else if (['zip', 'rar', '7z'].includes(ext)) {
        return { type: 'ARCHIVE', icon: '📦', badgeClass: 'format-other', label: '壓縮檔' };
      }
      return { type: ext.toUpperCase() || 'FILE', icon: '📄', badgeClass: 'format-other', label: ext.toUpperCase() || '一般檔案' };
    }

    async function listAllFilesInFolder(folderPrefix) {
      const resultFiles = [];
      const { data: items, error } = await client.storage
        .from(BUCKET_NAME)
        .list(folderPrefix, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

      if (error || !items) return resultFiles;

      for (const item of items) {
        if (item.name === '.emptyFolderPlaceholder') continue;

        const isSubFolder = item.id === null || !item.metadata;
        const currentPath = folderPrefix ? `${folderPrefix}/${item.name}` : item.name;

        if (isSubFolder) {
          const subItems = await listAllFilesInFolder(currentPath);
          resultFiles.push(...subItems);
        } else {
          resultFiles.push({
            ...item,
            fullPath: currentPath,
            folderPath: folderPrefix || '一般根目錄文件'
          });
        }
      }
      return resultFiles;
    }

    let isAllExpanded = true;

    async function loadCustomerFiles() {
      fileListBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">正在讀取並分類檔案結構...</td></tr>';

      try {
        let allFiles = [];

        if (currentUserRole === 'admin') {
          const { data: rootItems, error: rootError } = await client.storage
            .from(BUCKET_NAME)
            .list('', { limit: 100 });

          if (rootError) throw rootError;

          for (const item of rootItems || []) {
            if (item.name === '.emptyFolderPlaceholder') continue;
            const isFolder = item.id === null || !item.metadata;
            if (isFolder) {
              const subFiles = await listAllFilesInFolder(item.name);
              allFiles.push(...subFiles);
            } else {
              allFiles.push({
                ...item,
                fullPath: item.name,
                folderPath: '根目錄一般文件'
              });
            }
          }
        } else {
          allFiles = await listAllFilesInFolder(currentUsername);
        }

        if (allFiles.length === 0) {
          fileListBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">目前尚無任何檢驗檔案</td></tr>';
          return;
        }

        const groupedFolders = {};
        allFiles.forEach(f => {
          const groupName = f.folderPath;
          if (!groupedFolders[groupName]) {
            groupedFolders[groupName] = [];
          }
          groupedFolders[groupName].push(f);
        });

        let tableHtml = '';
        let groupIndex = 0;

        for (const [folderName, files] of Object.entries(groupedFolders)) {
          const folderId = `folder_group_${groupIndex}`;
          
          tableHtml += `
            <tr class="folder-row" onclick="toggleFolder('${folderId}')">
              <td colspan="5">
                <div class="folder-title">
                  <span class="folder-arrow expanded" id="arrow_${folderId}">▶</span>
                  <span>📁 ${folderName}</span>
                  <span class="folder-count-badge">${files.length} 個檔案</span>
                  <span style="font-size: 11px; color: #64748b; margin-left: auto;">點擊展開/收合目錄</span>
                </div>
              </td>
            </tr>
          `;

          for (const file of files) {
            const formatMeta = getFileFormatMeta(file.name);
            const sizeKB = (file.metadata?.size ? (file.metadata.size / 1024).toFixed(1) : '0.0') + ' KB';
            const updatedTime = file.created_at ? new Date(file.created_at).toLocaleString('zh-TW', { hour12: false }) : '-';

            const { data: signData } = await client.storage
              .from(BUCKET_NAME)
              .createSignedUrl(file.fullPath, 600);

            const downloadUrl = signData ? signData.signedUrl : '#';

            tableHtml += `
              <tr class="file-row ${folderId}">
                <td>
                  <div class="file-name-cell">
                    <span style="font-size: 16px;">${formatMeta.icon}</span>
                    <span style="color: #f1f5f9; font-weight: 500;">${file.name}</span>
                  </div>
                </td>
                <td>
                  <span class="format-badge ${formatMeta.badgeClass}">${formatMeta.type}</span>
                  <span style="font-size: 11px; color: #94a3b8; margin-left: 4px;">${formatMeta.label}</span>
                </td>
                <td>${sizeKB}</td>
                <td>${updatedTime}</td>
                <td style="text-align: center;">
                  <a href="${downloadUrl}" target="_blank" download="${file.name}" class="btn-action">
                    下載檔案
                  </a>
                </td>
              </tr>
            `;
          }
          groupIndex++;
        }

        fileListBody.innerHTML = tableHtml;

      } catch (err) {
        console.error('檔案清單載入失敗:', err);
        fileListBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171; padding: 20px;">載入失敗：${err.message}</td></tr>`;
      }
    }

    window.toggleFolder = function(folderId) {
      const rows = document.querySelectorAll(`.${folderId}`);
      const arrow = document.getElementById(`arrow_${folderId}`);
      
      const isHidden = rows.length > 0 && rows[0].classList.contains('hidden');
      rows.forEach(r => {
        if (isHidden) {
          r.classList.remove('hidden');
        } else {
          r.classList.add('hidden');
        }
      });

      if (arrow) {
        if (isHidden) {
          arrow.classList.add('expanded');
        } else {
          arrow.classList.remove('expanded');
        }
      }
    };

    toggleAllFoldersBtn.addEventListener('click', () => {
      isAllExpanded = !isAllExpanded;
      const allFileRows = document.querySelectorAll('.file-row');
      const allArrows = document.querySelectorAll('.folder-arrow');

      allFileRows.forEach(row => {
        if (isAllExpanded) {
          row.classList.remove('hidden');
        } else {
          row.classList.add('hidden');
        }
      });

      allArrows.forEach(arrow => {

          arrow.classList.add('expanded');

          arrow.classList.remove('expanded');
        }
      });

      toggleAllFoldersBtn.innerText = isAllExpanded ? '📂 全部收合' : '📁 全部展開';
    });

    // ==========================================
    // 功能 3：客戶端上傳回傳檔案
    // ==========================================
    clientUploadBtn.addEventListener('click', async () => {
      const files = clientUploadInput.files;
      if (!files || files.length === 0) {
        alert('請先選取要回傳的檔案！');
        return;

      const file = files[0];
      const timestamp = Date.now();
      const fileExt = file.name.split('.').pop();
      const baseName = file.name.substring(0, file.name.lastIndexOf('.')).replace(/[^a-zA-Z0-9_-]/g, '_');
      const sanitizedName = `${baseName}.${fileExt}`;
      const filePath = `${currentUsername}/client_feedback/${timestamp}_${sanitizedName}`;

      try {
        clientUploadBtn.disabled = true;
        uploadStatusText.innerText = '正在傳輸檔案至安全雲端空間...';
        uploadStatusText.style.color = '#38bdf8';

        const { data, error } = await client.storage
          .from(BUCKET_NAME)
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (error) throw error;

        uploadStatusText.innerText = `上傳成功！已送達伺服器 (${file.name})`;
        uploadStatusText.style.color = '#34d399';

        clientUploadBtn.disabled = false;
      }

    // ==========================================
    // 功能 4：Excel 匯出與管理員匯入 (寫入當前活耀資料表)
    // ==========================================
    const downloadExcelBtn = document.getElementById('downloadExcelBtn');
    const importExcelBtn = document.getElementById('importExcelBtn');
    const excelImportInput = document.getElementById('excelImportInput');

    downloadExcelBtn.addEventListener('click', () => {
      if (!currentInspectionData || currentInspectionData.length === 0) {
        alert('目前無檢驗數據可供匯出！');
        return;
      }

      const exportRows = currentInspectionData.map(item => {
        const row = {};
        currentTableHeaders.forEach(h => {
          const colLabel = h.label || h.key || h;
          const colKey = h.key || h;
          row[colLabel] = item[colKey] !== undefined ? item[colKey] : '';
        });
        return row;
      });

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const colWidths = currentTableHeaders.map(h => ({
        wch: Math.max((h.label ? h.label.length * 2.5 : 12), 14)
      }));
      worksheet['!cols'] = colWidths;

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "專屬檢驗報表");

      const todayStr = new Date().toISOString().split('T')[0];
      const targetTable = activeTableName || (getCandidateTableNames()[0]);
      const filename = `專屬報表_${targetTable}_${todayStr}.xlsx`;
      XLSX.writeFile(workbook, filename);
    });

    importExcelBtn.addEventListener('click', () => {
      excelImportInput.click();
    });

    excelImportInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const targetTable = activeTableName || (getCandidateTableNames()[0]);
      if (!targetTable) {
        alert('尚未取得目標資料表名稱，請先確認登入狀態');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

          if (jsonData.length === 0) {
            alert('Excel 內容為空或無有效數據列！');
            return;
          }

          importExcelBtn.innerText = '正在寫入資料庫...';
          importExcelBtn.disabled = true;

          const { data: insertedData, error: insertError } = await client
            .from(targetTable)
            .insert(jsonData);

          if (insertError) {
            console.warn('寫入資料庫提示:', insertError.message);
            const sample = jsonData[0];
            const dynamicHeaders = Object.keys(sample).map(k => ({ key: k, label: k }));
            renderDynamicInspectionTable(dynamicHeaders, jsonData);
            alert(`已在前端預覽 ${jsonData.length} 筆資料。（寫入 Supabase 提醒：${insertError.message}）`);
          } else {
            alert(`🎉 成功匯入 ${jsonData.length} 筆數據至 ${targetTable}！`);
            loadInspectionData();
          }

        } catch (err) {
          console.error('Excel 解析失敗:', err);
          alert('解析 Excel 檔案出錯：' + err.message);
        } finally {
          importExcelBtn.innerText = '📥 匯入 Excel 連動';
          importExcelBtn.disabled = false;
          excelImportInput.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // 啟動時檢查狀態
    checkAuthSession();
  </script>
</body>
</html>
